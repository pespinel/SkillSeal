name: "SkillSeal Agent Skill Linter"
description: "Lint Agent Skills (SKILL.md) for specification, quality, security, and portability issues."
author: "Pablo Espinel"
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Path to a SKILL.md file or a directory of skills."
    required: false
    default: "."
  fail-on:
    description: "Minimum severity that fails the action (warning|error)."
    required: false
    default: "error"
  format:
    description: "Output format (terminal|json)."
    required: false
    default: "terminal"
  ignore:
    description: "Space-separated list of finding-id prefixes to suppress."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      with:
        version: "latest"

    - shell: bash
      run: |
        ignore_args=()
        for prefix in ${{ inputs.ignore }}; do
          ignore_args+=(--ignore "$prefix")
        done
        uvx skillseal check "${{ inputs.path }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --format "${{ inputs.format }}" \
          "${ignore_args[@]}"
