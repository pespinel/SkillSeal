name: Auto Release

# Triggered by CI finishing (not by push directly) so a release can never go
# out for a commit whose tests haven't actually passed. If pyproject.toml's
# version doesn't match any existing tag, tags it and calls release.yml
# in-process (a tag pushed with the default GITHUB_TOKEN does NOT trigger
# other workflows via `push`, so we invoke it directly instead of relying on
# that).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.check.outputs.new_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Check whether pyproject.toml's version is already tagged
        id: check
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v$version"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "$tag already exists, nothing to release."
            echo "new_tag=" >> "$GITHUB_OUTPUT"
          else
            echo "new_tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag
        if: steps.check.outputs.new_tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.check.outputs.new_tag }}" "${{ github.event.workflow_run.head_sha }}"
          git push origin "${{ steps.check.outputs.new_tag }}"

  release:
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.new_tag }}
