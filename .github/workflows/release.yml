name: Release

# Two ways in — both genuine top-level triggers, deliberately NOT
# workflow_call: PyPI Trusted Publishing does not support reusable-workflow
# invocation and will reject the OIDC exchange if this is called that way
# (https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github).
#   1. workflow_dispatch — auto-release.yml dispatches this via the API right
#      after CI passes on a pyproject.toml version bump on main. This is the
#      normal path.
#   2. push: tags — a manual escape hatch (`git tag vX.Y.Z && git push origin
#      vX.Y.Z`) for re-running or backfilling a release by hand.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the triggering tag push)."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to sign the build provenance attestation
      attestations: write # required to publish the attestation
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Verify pyproject version matches the tag
        run: |
          tag="${RELEASE_TAG#v}"
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match pyproject.toml version $version" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/skillseal/
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC), no token/secret needed
      contents: write # required to create the GitHub Release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Full history + tags, needed to diff commits since the previous
      # release. `--generate-notes` summarizes merged PRs, which this repo
      # doesn't use (commits land on main directly) — it silently produced
      # an empty changelog. Commit subjects are already Conventional Commits,
      # so the log itself is the changelog.
      #
      # Must run BEFORE "Download dist": actions/checkout wipes untracked
      # files in the workspace, which would delete an already-downloaded
      # dist/ and fail "gh release create ... dist/*" with a glob miss.
      - name: Checkout full history for changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev_tag=$(git tag --sort=-v:refname | grep -Fxv "$RELEASE_TAG" | head -1)
          range="${prev_tag:+${prev_tag}..}${RELEASE_TAG}"
          notes=$(git log "$range" --no-merges --pretty=format:'- %s' | grep -v '^- chore(release):' || true)
          if [ -n "$prev_tag" ]; then
            notes="${notes}"$'\n\n'"**Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev_tag}...${RELEASE_TAG}"
          fi
          gh release create "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --title "$RELEASE_TAG" \
            --notes "$notes" \
            dist/*
