[project]
name = "skillseal"
version = "0.23.0"
description = "Lint, score, and routing-test Agent Skills (SKILL.md) before your agents do."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["agent-skills", "skill-md", "linter", "cli", "claude", "agentskills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://pespinel.github.io/SkillSeal/"
Documentation = "https://pespinel.github.io/SkillSeal/"
Repository = "https://github.com/pespinel/skillseal"
Issues = "https://github.com/pespinel/skillseal/issues"
Changelog = "https://github.com/pespinel/skillseal/releases"

[project.scripts]
skillseal = "skillseal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillseal"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
